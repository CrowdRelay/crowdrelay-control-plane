<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 48" role="img" aria-labelledby="title desc">
  <title id="title">Get it on Google Play</title>
  <desc id="desc">Google Play Store badge</desc>
  <defs>
    <linearGradient id="gpBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#16181d"/>
      <stop offset="100%" stop-color="#0a0c0f"/>
    </linearGradient>
    <linearGradient id="gpBlue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00C2FF"/>
      <stop offset="100%" stop-color="#0086E0"/>
    </linearGradient>
    <linearGradient id="gpGreen" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#00E37A"/>
      <stop offset="100%" stop-color="#00C455"/>
    </linearGradient>
    <linearGradient id="gpAmber" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFD500"/>
      <stop offset="100%" stop-color="#FFA800"/>
    </linearGradient>
    <linearGradient id="gpRed" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FF4B5C"/>
      <stop offset="100%" stop-color="#E8232F"/>
    </linearGradient>
  </defs>

  <rect x="0.5" y="0.5" width="159" height="47" rx="7.5"
        fill="url(#gpBg)" stroke="rgba(255,255,255,0.14)" stroke-width="1"/>

  <!-- Google Play mark. Four faces of one folded sheet: they share the crease
       (14.54,12) and the tip (20.75,12), so the seams close instead of leaving
       the gaps the previous hand-drawn version had. -->
  <g transform="translate(10.04,8.16) scale(1.32)">
    <path d="M3,20.5V3.5C3,2.91 3.34,2.39 3.84,2.15L13.69,12L3.84,21.85C3.34,21.6 3,21.09 3,20.5Z" fill="url(#gpBlue)"/>
    <path d="M16.81,15.12L6.05,21.34L14.54,12.85L16.81,15.12Z" fill="url(#gpGreen)"/>
    <path d="M20.16,10.81C20.5,11.08 20.75,11.5 20.75,12C20.75,12.5 20.53,12.9 20.18,13.18L17.89,14.5L15.39,12L17.89,9.5L20.16,10.81Z" fill="url(#gpAmber)"/>
    <path d="M6.05,2.66L16.81,8.88L14.54,11.15L6.05,2.66Z" fill="url(#gpRed)"/>
  </g>

  <text x="48" y="20" font-family="Roboto, 'Google Sans', system-ui, -apple-system, 'Segoe UI', sans-serif"
        font-size="8.5" font-weight="500" fill="#c2c8d2" letter-spacing="0.9">GET IT ON</text>
  <text x="47.2" y="37" font-family="Roboto, 'Google Sans', system-ui, -apple-system, 'Segoe UI', sans-serif"
        font-size="17" font-weight="500" fill="#ffffff" letter-spacing="-0.3">Google Play</text>
</svg>
