<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 144 44" role="img" aria-labelledby="title desc">
  <title id="title">Get it on Google Play</title>
  <desc id="desc">Google Play Store badge</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f1115"/>
      <stop offset="100%" stop-color="#070908"/>
    </linearGradient>
    <linearGradient id="playBlue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00d4ff"/>
      <stop offset="100%" stop-color="#00a0e5"/>
    </linearGradient>
    <linearGradient id="playGreen" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#3ddc84"/>
      <stop offset="100%" stop-color="#00d4aa"/>
    </linearGradient>
    <linearGradient id="playYellow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffd34e"/>
      <stop offset="100%" stop-color="#ffb13d"/>
    </linearGradient>
    <linearGradient id="playRed" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff5252"/>
      <stop offset="100%" stop-color="#e02020"/>
    </linearGradient>
  </defs>
  <rect width="144" height="44" rx="6" fill="url(#bg)" stroke="rgba(255,255,255,0.08)" stroke-width="0.5"/>
  <!-- Google Play triangle logo — four-color folded play button -->
  <g transform="translate(7, 9) scale(0.85)">
    <path d="M 2.5 0.8 C 2.0 1.1 1.7 1.7 1.7 2.5 L 1.7 23.5 C 1.7 24.3 2.0 24.9 2.5 25.2 L 14.5 13.0 Z" fill="url(#playBlue)"/>
    <path d="M 2.5 25.2 C 3.0 25.5 3.7 25.4 4.4 25.0 L 18.5 16.9 L 14.5 13.0 Z" fill="url(#playGreen)"/>
    <path d="M 2.5 0.8 C 3.0 0.5 3.7 0.6 4.4 1.0 L 18.5 9.1 L 14.5 13.0 Z" fill="url(#playYellow)"/>
    <path d="M 14.5 13.0 L 18.5 9.1 L 25.5 13.1 C 26.8 13.9 26.8 15.1 25.5 15.9 L 18.5 19.9 L 14.5 16.0 Z" fill="url(#playRed)"/>
  </g>
  <text x="34" y="19" font-family="'Google Sans', system-ui, -apple-system, sans-serif" font-size="7.5" font-weight="400" fill="#9ca3af" letter-spacing="0.3">GET IT ON</text>
  <text x="34" y="33" font-family="'Google Sans', system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" fill="#f7f7f8" letter-spacing="-0.2">Google Play</text>
</svg>
