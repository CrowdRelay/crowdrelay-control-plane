<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#0b0c0f" />
    <meta name="description" content="CrowdRelay Control Plane — operator console for tenants, deployments, and ecosystem health." />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="64x64" href="/crowdrelay-brand-mark.png" />
    <link rel="apple-touch-icon" sizes="64x64" href="/crowdrelay-brand-mark.png" />
    <title>CrowdRelay Control Plane</title>
    <style>
      .regional-profile-footer{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-top:18px;padding-top:16px;border-top:1px solid #262a33}
      .readiness-message{display:inline-flex;align-items:center;gap:8px;color:#9097a5;font-size:.82rem;line-height:1.4}
      .rum-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:14px}
      .rum-grid>div{min-width:0;padding:13px;border:1px solid #262a33;border-radius:10px;background:#0d0f13}
      .rum-grid strong,.rum-grid span,.rum-grid small{display:block}
      .rum-grid span{margin-top:4px;color:#9097a5;font-size:.72rem}
      .rum-grid small{margin-top:4px;color:#7d8491;font-size:.68rem;line-height:1.4}
      .autopilot-section>.rum-grid{margin-top:18px;padding-top:14px;border-top:1px solid #262a33}
      @media(max-width:900px){.regional-profile-footer{align-items:flex-start;flex-direction:column}.rum-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
      @media(max-width:560px){.rum-grid{grid-template-columns:1fr}}
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
