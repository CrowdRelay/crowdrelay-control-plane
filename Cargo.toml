[workspace]
members = ["crates/control-plane-api"]
resolver = "2"

# The image ships this release build: strip symbols and spend link time on
# cross-crate inlining instead of shipping megabytes of metadata. Deliberately
# no `panic = "abort"` — one panicked handler must not take the server down.
[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

[workspace.package]
edition = "2024"
license = "MIT"
rust-version = "1.85"
version = "0.1.0"

[workspace.dependencies]
anyhow = "1.0"
argon2 = "0.5"
async-stream = "0.3"
axum = "0.8.9"
chrono = { version = "0.4", features = ["serde"] }
csv = "1.3"
futures-util = "0.3"
rand_core = { version = "0.6", features = ["getrandom"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
sqlx = { version = "0.8.6", default-features = false, features = ["runtime-tokio-rustls", "postgres", "uuid", "chrono", "json", "migrate", "macros"] }
subtle = "2.6"
thiserror = "2.0"
tokio = { version = "1.47", features = ["macros", "rt-multi-thread", "signal", "net", "io-util", "time"] }
tower-http = { version = "0.6", features = ["compression-gzip", "fs", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
url = "2.5"
uuid = { version = "1.18", features = ["v4", "serde"] }
