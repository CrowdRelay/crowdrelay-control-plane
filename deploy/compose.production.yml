name: crowdrelay-control-plane

services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: control_plane
      POSTGRES_USER: control_plane
      POSTGRES_PASSWORD: ${CONTROL_PLANE_DB_PASSWORD}
    volumes:
      - control-plane-pg:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U control_plane -d control_plane"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s
    mem_limit: 384m
    cpus: 0.50
    security_opt:
      - no-new-privileges:true
    networks:
      - internal

  app:
    image: crowdrelay-control-plane:${CONTROL_PLANE_IMAGE_TAG}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://control_plane:${CONTROL_PLANE_DB_PASSWORD}@postgres:5432/control_plane
      CONTROL_PLANE_BIND: 0.0.0.0:8090
      CONTROL_PLANE_ADMIN_TOKEN: ${CONTROL_PLANE_ADMIN_TOKEN}
      CONTROL_PLANE_TELEMETRY_TOKEN: ${CONTROL_PLANE_TELEMETRY_TOKEN}
      CONTROL_PLANE_AUTOMATION_TOKEN: ${CONTROL_PLANE_AUTOMATION_TOKEN:-}
      CONTROL_PLANE_N8N_BASE_URL: ${CONTROL_PLANE_N8N_BASE_URL:-}
      CONTROL_PLANE_N8N_API_KEY: ${CONTROL_PLANE_N8N_API_KEY:-}
      CONTROL_PLANE_DISCORD_AUTOMATION_WEBHOOK_URL: ${CONTROL_PLANE_DISCORD_AUTOMATION_WEBHOOK_URL:-}
      # The Notifiers panel names this variable as the fix when the email
      # relay is unset, and neither compose file passed it through — so
      # setting it changed nothing and the panel kept asking for it. Both
      # colours need it or a cutover silently drops the relay.
      CONTROL_PLANE_NOTIFY_EMAIL_RELAY_URL: ${CONTROL_PLANE_NOTIFY_EMAIL_RELAY_URL:-}
      CONTROL_PLANE_ADMIN_ACTOR: ${CONTROL_PLANE_ADMIN_ACTOR:-wojciechbator}
      CONTROL_PLANE_FRONTEND_DIST: /app/frontend/dist
      CONTROL_PLANE_VIRYA_CROWDRELAY_URL: ${CONTROL_PLANE_VIRYA_CROWDRELAY_URL:-https://signal-api.virya.music}
      CONTROL_PLANE_VIRYA_SIGNAL_URL: ${CONTROL_PLANE_VIRYA_SIGNAL_URL:-https://signal.virya.music}
      CONTROL_PLANE_AREA_MANAGEMENT_MASTER_KEY: ${CONTROL_PLANE_AREA_MANAGEMENT_MASTER_KEY:-}
      CONTROL_PLANE_MANAGEMENT_MASTER_KEY: ${CONTROL_PLANE_MANAGEMENT_MASTER_KEY:-}
      CONTROL_PLANE_VIRYA_MANAGEMENT_URL: ${CONTROL_PLANE_VIRYA_MANAGEMENT_URL:-http://virya-area-tunnel:18080}
      CONTROL_PLANE_AGENT_SERVICE_URL: ${CONTROL_PLANE_AGENT_SERVICE_URL:-http://agent-service:8095}
      CONTROL_PLANE_PROVISIONER_TOKEN: ${CONTROL_PLANE_PROVISIONER_TOKEN:-}
      CONTROL_PLANE_PROVISIONER_DEFAULT_IMAGE_TAG: ${CONTROL_PLANE_PROVISIONER_DEFAULT_IMAGE_TAG:-}
      CONTROL_PLANE_PROVISIONER_API_IMAGE: ${CONTROL_PLANE_PROVISIONER_API_IMAGE:-ghcr.io/crowdrelay/crowdrelay-api}
      CONTROL_PLANE_PROVISIONER_WORKER_IMAGE: ${CONTROL_PLANE_PROVISIONER_WORKER_IMAGE:-ghcr.io/crowdrelay/crowdrelay-worker}
      CONTROL_PLANE_PROVISIONER_LEASE_SECONDS: ${CONTROL_PLANE_PROVISIONER_LEASE_SECONDS:-900}
      CONTROL_PLANE_GITHUB_DEPLOY_TOKEN: ${CONTROL_PLANE_GITHUB_DEPLOY_TOKEN:-}
      CONTROL_PLANE_GITHUB_DEPLOY_REPO: ${CONTROL_PLANE_GITHUB_DEPLOY_REPO:-}
      CONTROL_PLANE_BOOTSTRAP_ADMIN_USERNAME: ${CONTROL_PLANE_BOOTSTRAP_ADMIN_USERNAME:-}
      CONTROL_PLANE_BOOTSTRAP_ADMIN_PASSWORD: ${CONTROL_PLANE_BOOTSTRAP_ADMIN_PASSWORD:-}
      CONTROL_PLANE_ALLOWED_REDIRECT_ORIGINS: ${CONTROL_PLANE_ALLOWED_REDIRECT_ORIGINS:-}
      RUST_LOG: ${RUST_LOG:-info,tower_http=info}
    ports:
      - "127.0.0.1:8090:8090"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8090/healthz/ready >/dev/null || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 10s
    mem_limit: 256m
    cpus: 0.50
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      internal: {}
      virya-edge:
        aliases: [control-plane, control-plane-active]

  agent-service:
    image: ghcr.io/crowdrelay/crowdrelay-agents:${AGENT_SERVICE_IMAGE_TAG:?AGENT_SERVICE_IMAGE_TAG required}
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    environment:
      AGENT_SERVICE_BIND: "0.0.0.0:8095"
      DATABASE_URL: "postgres://crowdrelay:${CROWDRELAY_DB_PASSWORD:?CROWDRELAY_DB_PASSWORD required}@crowdrelay-db:5432/crowdrelay"
      AGENT_SERVICE_AUTH_KEY: "${AGENT_SERVICE_AUTH_KEY:?AGENT_SERVICE_AUTH_KEY required}"
      AGENT_SERVICE_ENCRYPTION_KEY: "${AGENT_SERVICE_ENCRYPTION_KEY:?AGENT_SERVICE_ENCRYPTION_KEY required}"
      REDDIT_BROWSER_PROFILE_DIR: "/data/reddit-browser-profile"
      OPENCODE_ZEN_TOKEN: "${OPENCODE_ZEN_TOKEN:-}"
      GOOGLE_API_KEY: "${GOOGLE_API_KEY:-}"
      GROQ_API_KEY: "${GROQ_API_KEY:-}"
      GOOGLE_OAUTH_CLIENT_ID: "${GOOGLE_OAUTH_CLIENT_ID:-}"
      GOOGLE_OAUTH_CLIENT_SECRET: "${GOOGLE_OAUTH_CLIENT_SECRET:-}"
      OPENAI_OAUTH_CLIENT_ID: "${OPENAI_OAUTH_CLIENT_ID:-}"
      OPENAI_OAUTH_CLIENT_SECRET: "${OPENAI_OAUTH_CLIENT_SECRET:-}"
      ANTHROPIC_OAUTH_CLIENT_ID: "${ANTHROPIC_OAUTH_CLIENT_ID:-}"
      ANTHROPIC_OAUTH_CLIENT_SECRET: "${ANTHROPIC_OAUTH_CLIENT_SECRET:-}"
      OPENROUTER_OAUTH_CLIENT_ID: "${OPENROUTER_OAUTH_CLIENT_ID:-}"
      OPENROUTER_OAUTH_CLIENT_SECRET: "${OPENROUTER_OAUTH_CLIENT_SECRET:-}"
      GITHUB_OAUTH_CLIENT_ID: "${GITHUB_OAUTH_CLIENT_ID:-}"
      GITHUB_OAUTH_CLIENT_SECRET: "${GITHUB_OAUTH_CLIENT_SECRET:-}"
      RUST_LOG: "${RUST_LOG:-info}"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:8095/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 10s
    # Playwright/Chromium needs more memory than a pure API service.
    # The browser is used for Reddit scraping (6h cycle) and posting (on demand).
    mem_limit: 512m
    cpus: 1.0
    # read_only is relaxed because Playwright writes to the profile directory
    # and needs to create temp files during browser operation.
    read_only: false
    tmpfs:
      - /tmp:size=64m,mode=1777
    volumes:
      - agent-browser-state:/data
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      internal: {}
      crowdrelay-shared: {}

  virya-area-tunnel:
    image: caddy@sha256:5f5c8640aae01df9654968d946d8f1a56c497f1dd5c5cda4cf95ab7c14d58648
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    environment:
      VIRYA_AREA_UPSTREAM: ${VIRYA_AREA_UPSTREAM:-http://area-management-proxy:18080}
    volumes:
      - ./deploy/virya-area-tunnel.Caddyfile:/etc/caddy/Caddyfile:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -T 3 -O /dev/null http://127.0.0.1:18080/healthz/ready"]
      interval: 5s
      timeout: 5s
      retries: 3
      start_period: 10s
    read_only: true
    tmpfs:
      - /data
      - /config
      - /tmp
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    # Standalone networks — not network_mode: service:app. The tunnel listens
    # on 0.0.0.0:18080 and the app reaches it at http://virya-area-tunnel:18080.
    # This decouples the tunnel from the app container's lifecycle: recreating
    # the app no longer breaks the tunnel's network namespace.
    networks:
      internal: {}
      virya-edge: {}

volumes:
  control-plane-pg:
  agent-browser-state:

networks:
  internal:
    driver: bridge
  virya-edge:
    external: true
  crowdrelay-shared:
    external: true
    name: crowdrelay-shared
