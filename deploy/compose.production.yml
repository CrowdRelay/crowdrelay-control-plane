name: crowdrelay-control-plane

services:
  postgres:
    image: ${CONTROL_PLANE_POSTGRES_IMAGE:-postgres:19beta3-alpine}
    restart: unless-stopped
    environment:
      POSTGRES_DB: control_plane
      POSTGRES_USER: control_plane
      POSTGRES_PASSWORD: ${CONTROL_PLANE_DB_PASSWORD}
    volumes:
      - control-plane-pg:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U control_plane -d control_plane"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s
    mem_limit: 384m
    cpus: 0.50
    security_opt:
      - no-new-privileges:true
    networks:
      - internal

  app:
    image: crowdrelay-control-plane:${CONTROL_PLANE_IMAGE_TAG}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://control_plane:${CONTROL_PLANE_DB_PASSWORD}@postgres:5432/control_plane
      CONTROL_PLANE_BIND: 0.0.0.0:8090
      CONTROL_PLANE_ADMIN_TOKEN: ${CONTROL_PLANE_ADMIN_TOKEN}
      CONTROL_PLANE_TELEMETRY_TOKEN: ${CONTROL_PLANE_TELEMETRY_TOKEN}
      CONTROL_PLANE_AUTOMATION_TOKEN: ${CONTROL_PLANE_AUTOMATION_TOKEN:-}
      CONTROL_PLANE_N8N_BASE_URL: ${CONTROL_PLANE_N8N_BASE_URL:-}
      CONTROL_PLANE_N8N_API_KEY: ${CONTROL_PLANE_N8N_API_KEY:-}
      CONTROL_PLANE_DISCORD_AUTOMATION_WEBHOOK_URL: ${CONTROL_PLANE_DISCORD_AUTOMATION_WEBHOOK_URL:-}
      # The Notifiers panel names this variable as the fix when the email
      # relay is unset, and neither compose file passed it through — so
      # setting it changed nothing and the panel kept asking for it. Both
      # colours need it or a cutover silently drops the relay.
      CONTROL_PLANE_NOTIFY_EMAIL_RELAY_URL: ${CONTROL_PLANE_NOTIFY_EMAIL_RELAY_URL:-}
      CONTROL_PLANE_ADMIN_ACTOR: ${CONTROL_PLANE_ADMIN_ACTOR:-wojciechbator}
      CONTROL_PLANE_FRONTEND_DIST: /app/frontend/dist
      CONTROL_PLANE_VIRYA_CROWDRELAY_URL: ${CONTROL_PLANE_VIRYA_CROWDRELAY_URL:-http://crowdrelay-api-active:8080}
      CONTROL_PLANE_VIRYA_SIGNAL_URL: ${CONTROL_PLANE_VIRYA_SIGNAL_URL:-https://virya.music/signal}
      CONTROL_PLANE_AREA_MANAGEMENT_MASTER_KEY: ${CONTROL_PLANE_AREA_MANAGEMENT_MASTER_KEY:-}
      CONTROL_PLANE_MANAGEMENT_MASTER_KEY: ${CONTROL_PLANE_MANAGEMENT_MASTER_KEY:-}
      CONTROL_PLANE_VIRYA_MANAGEMENT_URL: ${CONTROL_PLANE_VIRYA_MANAGEMENT_URL:-http://crowdrelay-api-active:8080}
      CONTROL_PLANE_AGENT_SERVICE_URL: ${CONTROL_PLANE_AGENT_SERVICE_URL:-http://agent-service:8095}
      CONTROL_PLANE_PROVISIONER_TOKEN: ${CONTROL_PLANE_PROVISIONER_TOKEN:-}
      CONTROL_PLANE_PROVISIONER_DEFAULT_IMAGE_TAG: ${CONTROL_PLANE_PROVISIONER_DEFAULT_IMAGE_TAG:-}
      CONTROL_PLANE_PROVISIONER_API_IMAGE: ${CONTROL_PLANE_PROVISIONER_API_IMAGE:-ghcr.io/crowdrelay/crowdrelay-api}
      CONTROL_PLANE_PROVISIONER_WORKER_IMAGE: ${CONTROL_PLANE_PROVISIONER_WORKER_IMAGE:-ghcr.io/crowdrelay/crowdrelay-worker}
      CONTROL_PLANE_PROVISIONER_LEASE_SECONDS: ${CONTROL_PLANE_PROVISIONER_LEASE_SECONDS:-900}
      CONTROL_PLANE_GITHUB_DEPLOY_TOKEN: ${CONTROL_PLANE_GITHUB_DEPLOY_TOKEN:-}
      CONTROL_PLANE_GITHUB_DEPLOY_REPO: ${CONTROL_PLANE_GITHUB_DEPLOY_REPO:-}
      CONTROL_PLANE_GITHUB_DEPLOY_COOLDOWN_SECONDS: ${CONTROL_PLANE_GITHUB_DEPLOY_COOLDOWN_SECONDS:-60}
      CONTROL_PLANE_BILLING_WEBHOOK_SECRET: ${CONTROL_PLANE_BILLING_WEBHOOK_SECRET:-}
      CONTROL_PLANE_BOOTSTRAP_ADMIN_USERNAME: ${CONTROL_PLANE_BOOTSTRAP_ADMIN_USERNAME:-}
      CONTROL_PLANE_BOOTSTRAP_ADMIN_PASSWORD: ${CONTROL_PLANE_BOOTSTRAP_ADMIN_PASSWORD:-}
      CONTROL_PLANE_BOOTSTRAP_VIEWER_USERNAME: ${CONTROL_PLANE_BOOTSTRAP_VIEWER_USERNAME:-}
      CONTROL_PLANE_BOOTSTRAP_VIEWER_PASSWORD: ${CONTROL_PLANE_BOOTSTRAP_VIEWER_PASSWORD:-}
      CONTROL_PLANE_ALLOWED_REDIRECT_ORIGINS: ${CONTROL_PLANE_ALLOWED_REDIRECT_ORIGINS:-}
      CONTROL_PLANE_ALLOWED_LANDING_ORIGINS: ${CONTROL_PLANE_ALLOWED_LANDING_ORIGINS:-https://crowdrelay.music}
      CONTROL_PLANE_RUNTIME_STALE_AFTER_SECONDS: ${CONTROL_PLANE_RUNTIME_STALE_AFTER_SECONDS:-180}
      CONTROL_PLANE_SHARED_PG_CLUSTER: ${CONTROL_PLANE_SHARED_PG_CLUSTER:-crowdrelay-tenants-pg}
      CONTROL_PLANE_SHARED_PG_NETWORK: ${CONTROL_PLANE_SHARED_PG_NETWORK:-crowdrelay-tenants}
      CONTROL_PLANE_SHARED_PG_MAX_TENANTS: ${CONTROL_PLANE_SHARED_PG_MAX_TENANTS:-30}
      CONTROL_PLANE_VIRYA_WORKSPACE_ID: ${CONTROL_PLANE_VIRYA_WORKSPACE_ID:-}
      CONTROL_PLANE_TELEMETRY_ACTOR: ${CONTROL_PLANE_TELEMETRY_ACTOR:-runtime-reporter}
      CONTROL_PLANE_PROVISIONER_ACTOR: ${CONTROL_PLANE_PROVISIONER_ACTOR:-tenant-provisioner}
      RUST_LOG: ${RUST_LOG:-info,tower_http=info}
    ports:
      - "127.0.0.1:8090:8090"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8090/healthz/ready >/dev/null || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 10s
    mem_limit: 256m
    cpus: 0.50
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      internal: {}
      crowdrelay-shared: {}
      virya-edge:
        aliases: [control-plane, control-plane-active]

  # WARNING: production does not run this block.
  #
  # `/srv/crowdrelay-control-plane` on the host is not a git checkout. It is a
  # hand-maintained operator directory, and the live agent-service is defined by
  # an untracked `compose.agents.yml` there — `deploy-bluegreen.sh` even says so
  # ("compose.agents.yml is optional"). The host's own `compose.production.yml`
  # has no agent-service block at all.
  #
  # So editing anything here — image, environment, mem_limit — changes nothing
  # that runs. Verified the hard way on 2026-09-13: a memory limit was raised
  # here, committed, deployed, and production still reported 512 MiB. This is
  # the same shape as the city_geocoding config that sat in a file no container
  # reads. Change the host file, and treat this one as a reference only.
  #
  # agent-browser: headed-Chromium sidecar for Reddit scraping. The agent
  # connects over CDP (REDDIT_BROWSER_CDP_URL) and borrows its persistent
  # context; the shared agent-browser-state volume holds the profile so the
  # Reddit session survives restarts of either service. CDP is internal-only.
  agent-browser:
    image: ghcr.io/crowdrelay/crowdrelay-agent-browser:latest
    restart: unless-stopped
    environment:
      REDDIT_BROWSER_PROFILE_DIR: "/data/reddit-browser-profile"
      TMPDIR: "/data/tmp"
    mem_limit: 1024m
    cpus: 1.0
    read_only: false
    tmpfs:
      - /tmp:size=64m,mode=1777
    volumes:
      - agent-browser-state:/data
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      internal: {}

  agent-service:
    image: ghcr.io/crowdrelay/crowdrelay-agents:${AGENT_SERVICE_IMAGE_TAG:?AGENT_SERVICE_IMAGE_TAG required}
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
      agent-browser:
        condition: service_healthy
    environment:
      AGENT_SERVICE_BIND: "0.0.0.0:8095"
      DATABASE_URL: "postgres://crowdrelay:${CROWDRELAY_DB_PASSWORD:?CROWDRELAY_DB_PASSWORD required}@crowdrelay-db:5432/crowdrelay"
      AGENT_SERVICE_AUTH_KEY: "${AGENT_SERVICE_AUTH_KEY:?AGENT_SERVICE_AUTH_KEY required}"
      AGENT_SERVICE_ENCRYPTION_KEY: "${AGENT_SERVICE_ENCRYPTION_KEY:?AGENT_SERVICE_ENCRYPTION_KEY required}"
      REDDIT_BROWSER_CDP_URL: "http://agent-browser:9222"
      REDDIT_BROWSER_PROFILE_DIR: "/data/reddit-browser-profile"
      # --disable-dev-shm-usage relocates Chromium's shared memory to
      # $TMPDIR. The /tmp tmpfs is 64m and a renderer's shm files on a real
      # Reddit page outgrow it — "Target crashed" with no container OOM.
      # Point temp at the disk-backed browser-state volume instead.
      TMPDIR: "/data/tmp"
      OPENCODE_ZEN_TOKEN: "${OPENCODE_ZEN_TOKEN:-}"
      GOOGLE_API_KEY: "${GOOGLE_API_KEY:-}"
      GROQ_API_KEY: "${GROQ_API_KEY:-}"
      GOOGLE_OAUTH_CLIENT_ID: "${GOOGLE_OAUTH_CLIENT_ID:-}"
      GOOGLE_OAUTH_CLIENT_SECRET: "${GOOGLE_OAUTH_CLIENT_SECRET:-}"
      OPENAI_OAUTH_CLIENT_ID: "${OPENAI_OAUTH_CLIENT_ID:-}"
      OPENAI_OAUTH_CLIENT_SECRET: "${OPENAI_OAUTH_CLIENT_SECRET:-}"
      ANTHROPIC_OAUTH_CLIENT_ID: "${ANTHROPIC_OAUTH_CLIENT_ID:-}"
      ANTHROPIC_OAUTH_CLIENT_SECRET: "${ANTHROPIC_OAUTH_CLIENT_SECRET:-}"
      OPENROUTER_OAUTH_CLIENT_ID: "${OPENROUTER_OAUTH_CLIENT_ID:-}"
      OPENROUTER_OAUTH_CLIENT_SECRET: "${OPENROUTER_OAUTH_CLIENT_SECRET:-}"
      GITHUB_OAUTH_CLIENT_ID: "${GITHUB_OAUTH_CLIENT_ID:-}"
      GITHUB_OAUTH_CLIENT_SECRET: "${GITHUB_OAUTH_CLIENT_SECRET:-}"
      RUST_LOG: "${RUST_LOG:-info}"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:8095/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 10s
    # The Chromium browser moved to the agent-browser sidecar — what remains
    # here is the node service plus the playwright client (~134 MiB measured
    # with the browser elsewhere). The 512m incident below is the reason the
    # sidecar carries its own 1 GB cap and disk-backed TMPDIR.
    #
    # 512m was not enough for in-container Chromium and failed in the worst
    # possible way: about:blank already took ~416 MiB (Node 157, Xvfb 55,
    # browser process 131, plus helpers), and each Reddit page's ~78 MiB
    # renderer was cgroup-killed. Playwright reports that as "Target
    # crashed", the join fell through to a Join button on a dead page, and
    # the worker's only symptom was "operation timed out" for hours while 41
    # communities stayed unjoined.
    mem_limit: 768m
    cpus: 1.0
    # read_only is relaxed because Playwright writes to the profile directory
    # and needs to create temp files during browser operation.
    read_only: false
    tmpfs:
      - /tmp:size=64m,mode=1777
    volumes:
      - agent-browser-state:/data
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      internal: {}
      crowdrelay-shared: {}

volumes:
  control-plane-pg:
  agent-browser-state:

networks:
  internal:
    driver: bridge
  virya-edge:
    external: true
  crowdrelay-shared:
    external: true
    name: crowdrelay-shared
