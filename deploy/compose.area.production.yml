# Area management overlay for Control Plane production deploy.
#
# Adds the management master keys and the area-management network so the
# control plane app can reach the CrowdRelay API directly on crowdrelay-shared.
# The virya-area-tunnel Caddy container was removed: it was a pure pass-through
# proxy that duplicated the path allowlist already enforced in
# tenant_area_client.rs. The app now calls crowdrelay-api-active:8080 directly.
services:
  app:
    environment:
      CONTROL_PLANE_AREA_MANAGEMENT_MASTER_KEY: "${CONTROL_PLANE_AREA_MANAGEMENT_MASTER_KEY:?CONTROL_PLANE_AREA_MANAGEMENT_MASTER_KEY required}"
      CONTROL_PLANE_MANAGEMENT_MASTER_KEY: "${CONTROL_PLANE_MANAGEMENT_MASTER_KEY:?CONTROL_PLANE_MANAGEMENT_MASTER_KEY required}"
      CONTROL_PLANE_VIRYA_MANAGEMENT_URL: "${CONTROL_PLANE_VIRYA_MANAGEMENT_URL:?CONTROL_PLANE_VIRYA_MANAGEMENT_URL required}"
    networks:
      internal: {}
      crowdrelay-shared: {}
      virya-edge:
        aliases: [control-plane]

networks:
  virya-edge:
    external: true
  crowdrelay-shared:
    external: true
    name: crowdrelay-shared
