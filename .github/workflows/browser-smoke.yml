name: Browser smoke

on:
  workflow_dispatch:
  # Fire automatically once a deploy has completed — a deploy is only done
  # when the browser still works, not when the container is merely healthy.
  workflow_run:
    workflows: ["Deploy"]
    types: [completed]

permissions:
  contents: read
  actions: write

concurrency:
  group: control-plane-browser-smoke
  cancel-in-progress: true

jobs:
  browser:
    runs-on: [self-hosted, arm64]
    # Manual runs always execute; workflow_run only on a successful deploy.
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    timeout-minutes: 15
    env:
      CONTROL_PLANE_BASE_URL: ${{ vars.CONTROL_PLANE_PRODUCTION_BASE_URL || 'https://control.crowdrelay.music' }}
      CONTROL_PLANE_SMOKE_BASIC_AUTH: ${{ secrets.CONTROL_PLANE_SMOKE_BASIC_AUTH }}
      CONTROL_PLANE_SMOKE_LOGIN: ${{ secrets.CONTROL_PLANE_SMOKE_LOGIN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Decide whether authenticated browser smoke is configured
        id: preflight
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${CONTROL_PLANE_SMOKE_BASIC_AUTH}" ]]; then
            echo 'enabled=false' >> "$GITHUB_OUTPUT"
            echo 'CONTROL_PLANE_BROWSER_SMOKE=SKIP reason=secret-not-configured'
            exit 0
          fi
          [[ "${CONTROL_PLANE_SMOKE_BASIC_AUTH}" == *:* ]]
          echo 'enabled=true' >> "$GITHUB_OUTPUT"

      - name: Restore pinned Playwright chromium cache
        if: steps.preflight.outputs.enabled == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-ms-playwright-1.62.1

      - name: Install pinned ephemeral browser test dependency
        if: steps.preflight.outputs.enabled == 'true'
        working-directory: frontend
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --package-lock=false --ignore-scripts @playwright/test@1.62.1
          npx playwright install --with-deps chromium

      - name: Run production browser journey
        if: steps.preflight.outputs.enabled == 'true'
        working-directory: frontend
        shell: bash
        run: npx playwright test e2e/control-plane.spec.ts --workers=1 --reporter=line

      # The regression suite's @smoke subset — same pinned browser, same
      # secret (user:pass split into the two vars the suite reads). This is
      # the only place the tagged suite runs against a live build; without
      # it, selector and state regressions only surface on a local `just test`.
      - name: Run tagged smoke suite against production
        if: steps.preflight.outputs.enabled == 'true'
        working-directory: playwright
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --package-lock=false --ignore-scripts @playwright/test@1.62.1
          export CONTROL_PLANE_TEST_USER="${CONTROL_PLANE_SMOKE_LOGIN%%:*}"
          export CONTROL_PLANE_TEST_PASS="${CONTROL_PLANE_SMOKE_LOGIN#*:}"
          npx playwright test --grep @smoke --workers=1 --reporter=line

      - name: Purge stale artifacts before upload
        if: always() && steps.preflight.outputs.enabled == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t ids < <(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=100" \
            --jq ".artifacts[] | select(.workflow_run.id != ${GITHUB_RUN_ID}) | select(.created_at < (now - 7200 | strftime(\"%Y-%m-%dT%H:%M:%SZ\"))) | .id" 2>/dev/null || true)
          for id in "${ids[@]}"; do
            gh api -X DELETE "repos/${GITHUB_REPOSITORY}/actions/artifacts/${id}" 2>/dev/null || true
          done
          echo "Purged ${#ids[@]} stale artifact(s)"
      - name: Upload browser diagnostics
        if: always() && steps.preflight.outputs.enabled == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: control-plane-browser-smoke-${{ github.run_id }}
          path: |
            frontend/test-results
            frontend/playwright-report
            playwright/test-results
            playwright/html-report
          if-no-files-found: ignore
          retention-days: 7
