name: CI

on:
  push:
    branches: [main]
    paths-ignore: ["**/*.md", "docs/**"]
  pull_request:
    paths-ignore: ["**/*.md", "docs/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: control-plane-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: [self-hosted, arm64]
    timeout-minutes: 20
    env:
      # Incremental compilation doubles fingerprint/dep state for products
      # nothing in CI ever reuses — a cancelled run's cache is cold anyway.
      # On the 45 GB host that doubling is what fills the disk.
      CARGO_INCREMENTAL: "0"
      # Full debuginfo is the majority of a debug test binary's size; line
      # tables keep panic backtraces readable at a fraction of the cost.
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      CARGO_PROFILE_TEST_DEBUG: line-tables-only
    services:
      postgres:
        image: postgres:19beta3-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ${{ secrets.CONTROL_PLANE_CI_PGPASSWORD }}
          POSTGRES_DB: control_plane_migration_test
        # Ephemeral host port: `[self-hosted, arm64]` matches more than one
        # runner on the shared host, so a PR run and a main run can overlap —
        # a fixed 5435 made the second one die at "port is already allocated".
        ports:
          - 5432
        # --tmpfs keeps postgres data in RAM — the image's declared VOLUME
        # would otherwise leave an anonymous volume behind on every run.
        # postgres 18+ declares VOLUME /var/lib/postgresql (PGDATA lives in
        # a versioned subdir); the mount must sit at that path — mounting at
        # /var/lib/postgresql/data trips the image's pg_ctlcluster layout
        # check and the container refuses to start.
        options: >-
          --tmpfs /var/lib/postgresql
          --health-cmd "pg_isready -U postgres -d control_plane_migration_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Activate Rust toolchain
        run: |
          echo "${HOME}/.cargo/bin" >> "$GITHUB_PATH"
          echo "RUSTUP_HOME=${HOME}/.rustup" >> "$GITHUB_ENV"
          echo "CARGO_HOME=${HOME}/.cargo" >> "$GITHUB_ENV"
          # A target dir outside _work survives any workspace wipe, so a run
          # only rebuilds what the push changed. Keyed by runner.name — the
          # runner context is only visible to steps — so each lane on this
          # host keeps its own dir off the others' package-cache lock.
          echo "CARGO_TARGET_DIR=${HOME}/.cargo-target/${{ runner.name }}" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.98.0
          components: rustfmt, clippy
      - name: Verify Rust toolchain
        run: |
          rustc --version --verbose
          cargo --version
      # The task runner is the single source of truth for gate commands;
      # CI calls the same recipes a developer runs locally.
      - uses: taiki-e/install-action@b6b84cf49ebfe0176417bdce007c624f0db37f20 # v2
        with:
          tool: just
      - name: Discard an inconsistent target directory
        # The target dir lives outside the workspace (CARGO_TARGET_DIR), so a
        # build that died partway through — a cancelled run gets SIGKILL, and
        # cancel-in-progress is on above — can leave a compiled artifact with
        # no dep-info beside it. Cargo treats that as a hard error rather than
        # rebuilding the unit, and it never recovers on its own, so one
        # interrupted run wedges the runner for every run after it. Every
        # artifact cargo writes gets a matching .d; if one does not have it,
        # the tree is inconsistent and the derived state is discarded. Only
        # fingerprints and deps go — cargo rebuilds both — and only when the
        # check actually finds a gap.
        shell: bash
        run: |
          set -uo pipefail
          inconsistent=0
          if [ -d "${CARGO_TARGET_DIR}/debug/deps" ]; then
            while IFS= read -r artifact; do
              stem=$(basename "${artifact}")
              stem=${stem%.*}
              stem=${stem#lib}
              if [ ! -f "${CARGO_TARGET_DIR}/debug/deps/${stem}.d" ]; then
                echo "no dep info for ${artifact}"
                inconsistent=1
                break
              fi
            done < <(find "${CARGO_TARGET_DIR}/debug/deps" -maxdepth 1 \( -name '*.rlib' -o -name '*.rmeta' \))
          fi
          if [ "${inconsistent}" -eq 1 ]; then
            echo "target dir is inconsistent; discarding fingerprints and deps"
            rm -rf "${CARGO_TARGET_DIR}/debug/.fingerprint" "${CARGO_TARGET_DIR}/debug/deps"
          else
            echo "target dir is consistent"
          fi
      # No Rust cache action here on purpose. Every job in this workflow runs
      # on the self-hosted runner, where the target dir persists outside the
      # workspace between runs, so an archived target/ buys nothing and
      # costs correctness: rust-cache prunes intermediate artifacts before it
      # saves but keeps the fingerprints that name them, and restoring that
      # archive over the runner's own live target/ leaves cargo reading a
      # fingerprint whose dep-info file is gone. That is the literal
      # "could not parse/generate dep info at: .../deps/zerocopy-*.d,
      # No such file or directory" that failed this workflow, and no re-run
      # clears it because the bad state is restored again each time.
      - run: just rust-fmt
      - name: PostgreSQL migration smoke
        env:
          # Dummy credential for the ephemeral service container — kept in a
          # repo secret so secret scanners stop flagging the literal.
          PGPASSWORD: ${{ secrets.CONTROL_PLANE_CI_PGPASSWORD }}
        run: |
          set -euo pipefail
          for migration in migrations/*.sql; do
            echo "==> ${migration}"
            psql \
              --host 127.0.0.1 \
              --port "${{ job.services.postgres.ports['5432'] }}" \
              --username postgres \
              --dbname control_plane_migration_test \
              --set ON_ERROR_STOP=1 \
              --file "${migration}"
          done
          echo "CONTROL_PLANE_MIGRATIONS=PASS"
      - run: just rust-clippy
      - run: just rust-test
      - name: Script gates (SQL prepare points at this job's migrated postgres)
        env:
          CONTROL_PLANE_PG_HOST: 127.0.0.1
          CONTROL_PLANE_PG_PORT: ${{ job.services.postgres.ports['5432'] }}
          CONTROL_PLANE_PG_USER: postgres
          CONTROL_PLANE_PG_DATABASE: control_plane_migration_test
          PGPASSWORD: ${{ secrets.CONTROL_PLANE_CI_PGPASSWORD }}
        run: just script-test

      - name: Sweep unattached Docker leftovers
        # Each job cleans what the previous one left — service-container
        # volumes only detach once the job that owned them ends.
        if: always()
        continue-on-error: true
        run: docker volume prune -f 2>/dev/null || true

  # The rustsec audit job is retired: the dependency set is frozen for the
  # feature-freeze stage and the reachable graph was already audited. If it
  # ever returns, keep the pinned prebuilt cargo-audit — compiling it from
  # source took >15 min and timed the job out (2026-09-17).
  container:
    name: Build container (PR validation)
    # Only on PRs — validates the Dockerfile builds. Main branch builds
    # and deploys happen in deploy.yml which is not cancellable.
    if: github.event_name == 'pull_request'
    runs-on: [self-hosted, arm64]
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Build linux/arm64 image (no publish)
        shell: bash
        run: |
          set -euo pipefail
          owner_lower="$(printf '%s' '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          cache_ref="ghcr.io/${owner_lower}/crowdrelay-control-plane-buildcache:arm64"
          docker buildx build \
            --platform linux/arm64 \
            --build-arg "VCS_REF=${GITHUB_SHA}" \
            --cache-from "type=registry,ref=${cache_ref}" \
            --tag crowdrelay-control-plane:ci \
            --load \
            .
          architecture="$(docker image inspect crowdrelay-control-plane:ci --format '{{.Architecture}}')"
          revision="$(docker image inspect crowdrelay-control-plane:ci --format '{{index .Config.Labels "org.opencontainers.image.revision"}}')"
          [[ "$architecture" == "arm64" ]] || { echo "ERROR: wrong architecture: $architecture" >&2; exit 1; }
          [[ "$revision" == "$GITHUB_SHA" ]] || { echo "ERROR: revision mismatch: $revision != $GITHUB_SHA" >&2; exit 1; }
          echo "CONTAINER=PASS arch=$architecture revision=$revision"
      - name: Prune stale BuildKit cache after build
        # Bounded, not scorched-earth: `--all` deleted the cargo cache mounts
        # after every build and the next one re-downloaded every crate.
        if: always()
        continue-on-error: true
        run: docker builder prune --filter until=72h -f 2>/dev/null || true

  web:
    runs-on: [self-hosted, arm64]
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --prefer-offline --no-audit --no-fund
      # The stylesheet grew by appending a fix layer each time something looked
      # wrong, until 343 declarations were being thrown away by the cascade.
      # This fails the build if dead declarations come back.
      - run: python3 scripts/dedupe-css.py src/styles/tailwind.css --check --fail-on-dead
        shell: bash
      - run: npm run build
