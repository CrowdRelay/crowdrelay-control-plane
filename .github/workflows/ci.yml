name: CI

on:
  push:
    branches: [main]
    paths-ignore: ["**/*.md", "docs/**"]
  pull_request:
    paths-ignore: ["**/*.md", "docs/**"]
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: control-plane-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: [self-hosted, arm64]
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:19beta3-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: control_plane_migration_test
        ports:
          - 5435:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d control_plane_migration_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Activate Rust toolchain
        run: |
          echo "/home/ubuntu/.cargo/bin" >> "$GITHUB_PATH"
          echo "RUSTUP_HOME=/home/ubuntu/.rustup" >> "$GITHUB_ENV"
          echo "CARGO_HOME=/home/ubuntu/.cargo" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.98.0
          components: rustfmt, clippy
      - name: Verify Rust toolchain
        run: |
          rustc --version --verbose
          cargo --version
      # The task runner is the single source of truth for gate commands;
      # CI calls the same recipes a developer runs locally.
      - uses: taiki-e/install-action@b6b84cf49ebfe0176417bdce007c624f0db37f20 # v2
        with:
          tool: just
      - name: Purge stale Rust cache entries
        # Each Cargo.lock change orphans the previous ~440 MB cache entry
        # until 7-day TTL. Prune before saving to stay within account quota.
        if: github.ref == 'refs/heads/main'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t ids < <(gh api "repos/${GITHUB_REPOSITORY}/actions/caches?per_page=100" \
            --jq '.actions_caches[] | select(.key | startswith("v0-rust-")) | .id' 2>/dev/null || true)
          for id in "${ids[@]}"; do
            gh api -X DELETE "repos/${GITHUB_REPOSITORY}/actions/caches/${id}" 2>/dev/null || true
          done
          echo "Purged ${#ids[@]} stale Rust cache entries"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: just rust-fmt
      - name: PostgreSQL migration smoke
        env:
          PGPASSWORD: postgres
        run: |
          set -euo pipefail
          for migration in migrations/*.sql; do
            echo "==> ${migration}"
            psql \
              --host 127.0.0.1 \
              --port 5435 \
              --username postgres \
              --dbname control_plane_migration_test \
              --set ON_ERROR_STOP=1 \
              --file "${migration}"
          done
          echo "CONTROL_PLANE_MIGRATIONS=PASS"
      - run: just rust-clippy
      - run: just rust-test
      - run: just script-test

  dependency-security:
    name: Dependency security
    runs-on: [self-hosted, arm64]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Activate Rust toolchain
        run: |
          echo "/home/ubuntu/.cargo/bin" >> "$GITHUB_PATH"
          echo "RUSTUP_HOME=/home/ubuntu/.rustup" >> "$GITHUB_ENV"
          echo "CARGO_HOME=/home/ubuntu/.cargo" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.98.0
      - name: Verify Rust toolchain
        run: |
          rustc --version --verbose
          cargo --version
      - name: Cache pinned cargo-audit binary
        id: cargo-audit-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /home/ubuntu/.cargo/bin/cargo-audit
          key: ${{ runner.os }}-cargo-audit-0.22.2
      - name: Install pinned cargo-audit
        if: steps.cargo-audit-cache.outputs.cache-hit != 'true'
        run: cargo install cargo-audit --locked --force --version 0.22.2
      - name: Audit reachable Rust dependencies
        shell: bash
        run: |
          set -euo pipefail
          rsa_graph="$(cargo tree --locked --workspace --all-features -i rsa 2>/dev/null)"
          if [[ -n "$rsa_graph" ]]; then
            echo "RUSTSEC-2023-0071 is reachable in an active dependency graph:" >&2
            echo "$rsa_graph" >&2
            exit 1
          fi
          cargo audit --ignore RUSTSEC-2023-0071

  container:
    name: Build container (PR validation)
    # Only on PRs — validates the Dockerfile builds. Main branch builds
    # and deploys happen in deploy.yml which is not cancellable.
    if: github.event_name == 'pull_request'
    runs-on: [self-hosted, arm64]
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Build linux/arm64 image (no publish)
        shell: bash
        run: |
          set -euo pipefail
          owner_lower="$(printf '%s' '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          cache_ref="ghcr.io/${owner_lower}/crowdrelay-control-plane-buildcache:arm64"
          docker buildx build \
            --platform linux/arm64 \
            --build-arg "VCS_REF=${GITHUB_SHA}" \
            --cache-from "type=registry,ref=${cache_ref}" \
            --tag crowdrelay-control-plane:ci \
            --load \
            .
          architecture="$(docker image inspect crowdrelay-control-plane:ci --format '{{.Architecture}}')"
          revision="$(docker image inspect crowdrelay-control-plane:ci --format '{{index .Config.Labels "org.opencontainers.image.revision"}}')"
          [[ "$architecture" == "arm64" ]] || { echo "ERROR: wrong architecture: $architecture" >&2; exit 1; }
          [[ "$revision" == "$GITHUB_SHA" ]] || { echo "ERROR: revision mismatch: $revision != $GITHUB_SHA" >&2; exit 1; }
          echo "CONTAINER=PASS arch=$architecture revision=$revision"
      - name: Prune BuildKit cache after build
        if: always()
        continue-on-error: true
        run: docker builder prune --all -f 2>/dev/null || true

  web:
    runs-on: [self-hosted, arm64]
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --prefer-offline --no-audit --no-fund
      # The stylesheet grew by appending a fix layer each time something looked
      # wrong, until 343 declarations were being thrown away by the cascade.
      # This fails the build if dead declarations come back.
      - run: python3 scripts/dedupe-css.py src/styles/tailwind.css --check --fail-on-dead
        shell: bash
      - run: npm run build
