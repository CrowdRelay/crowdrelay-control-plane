name: CI

on:
  push:
    branches: [main]
    paths-ignore: ["**/*.md", "docs/**"]
  pull_request:
    paths-ignore: ["**/*.md", "docs/**"]
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: control-plane-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: control_plane_migration_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d control_plane_migration_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy
      # The task runner is the single source of truth for gate commands;
      # CI calls the same recipes a developer runs locally.
      - uses: taiki-e/install-action@b6b84cf49ebfe0176417bdce007c624f0db37f20 # v2
        with:
          tool: just
      - name: Purge stale Rust cache entries
        # Each Cargo.lock change orphans the previous ~440 MB cache entry
        # until 7-day TTL. Prune before saving to stay within account quota.
        if: github.ref == 'refs/heads/main'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t ids < <(gh api "repos/${GITHUB_REPOSITORY}/actions/caches?per_page=100" \
            --jq '.actions_caches[] | select(.key | startswith("v0-rust-")) | .id' 2>/dev/null || true)
          for id in "${ids[@]}"; do
            gh api -X DELETE "repos/${GITHUB_REPOSITORY}/actions/caches/${id}" 2>/dev/null || true
          done
          echo "Purged ${#ids[@]} stale Rust cache entries"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: just rust-fmt
      - name: PostgreSQL migration smoke
        env:
          PGPASSWORD: postgres
        run: |
          set -euo pipefail
          for migration in migrations/*.sql; do
            echo "==> ${migration}"
            psql \
              --host 127.0.0.1 \
              --port 5432 \
              --username postgres \
              --dbname control_plane_migration_test \
              --set ON_ERROR_STOP=1 \
              --file "${migration}"
          done
          echo "CONTROL_PLANE_MIGRATIONS=PASS"
      - run: just rust-clippy
      - run: just rust-test
      - run: just script-test

  dependency-security:
    name: Dependency security
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.97.1
      - name: Cache pinned cargo-audit binary
        id: cargo-audit-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/bin/cargo-audit
          key: ${{ runner.os }}-cargo-audit-0.22.2
      - name: Install pinned cargo-audit
        if: steps.cargo-audit-cache.outputs.cache-hit != 'true'
        run: cargo install cargo-audit --locked --version 0.22.2
      - name: Audit reachable Rust dependencies
        shell: bash
        run: |
          set -euo pipefail
          rsa_graph="$(cargo tree --locked --workspace --all-features -i rsa 2>/dev/null)"
          if [[ -n "$rsa_graph" ]]; then
            echo "RUSTSEC-2023-0071 is reachable in an active dependency graph:" >&2
            echo "$rsa_graph" >&2
            exit 1
          fi
          cargo audit --ignore RUSTSEC-2023-0071

  container:
    name: Build production container (arm64)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Log in to GHCR for validated main builds
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build exact linux/arm64 production image
        env:
          CACHE_WRITE: ${{ github.ref == 'refs/heads/main' }}
          PUBLISH_IMAGE: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
        shell: bash
        run: |
          set -euo pipefail
          cache_args=(--cache-from "type=gha,scope=control-plane-image-arm64")
          if [[ "${CACHE_WRITE}" == "true" ]]; then
            cache_args+=(--cache-to "type=gha,mode=max,scope=control-plane-image-arm64")
          fi
          image="ghcr.io/$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')/crowdrelay-control-plane:sha-${GITHUB_SHA}"
          if [[ "${PUBLISH_IMAGE}" == "true" ]]; then
            docker buildx build \
              --platform linux/arm64 \
              --build-arg "VCS_REF=${GITHUB_SHA}" \
              "${cache_args[@]}" \
              --tag "$image" \
              --push \
              .
            docker pull "$image" >/dev/null
            architecture="$(docker image inspect "$image" --format '{{.Architecture}}')"
            revision="$(docker image inspect "$image" --format '{{index .Config.Labels "org.opencontainers.image.revision"}}')"
            repo_digests="$(docker image inspect "$image" --format '{{join .RepoDigests "\n"}}')"
            digest="$(docker buildx imagetools inspect "$image" --format '{{.Manifest.Digest}}')"
          else
            docker buildx build \
              --platform linux/arm64 \
              --build-arg "VCS_REF=${GITHUB_SHA}" \
              "${cache_args[@]}" \
              --tag crowdrelay-control-plane:ci \
              --load \
              .
            architecture="$(docker image inspect crowdrelay-control-plane:ci --format '{{.Architecture}}')"
            revision="$(docker image inspect crowdrelay-control-plane:ci --format '{{index .Config.Labels "org.opencontainers.image.revision"}}')"
            repo_digests=""
            digest="local"
          fi
          [[ "$architecture" == "arm64" ]]
          [[ "$revision" == "$GITHUB_SHA" ]]
          if [[ "$PUBLISH_IMAGE" == "true" ]]; then
            [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
            grep -Fq "@${digest}" <<<"$repo_digests"
            mkdir -p image-digest
            printf 'CONTROL_PLANE_RELEASE_SHA=%s\nCONTROL_PLANE_IMAGE_DIGEST=%s\n' \
              "$GITHUB_SHA" "$digest" > image-digest/image.env
            ( cd image-digest && sha256sum image.env > image.env.sha256 )
          fi
          echo "CONTROL_PLANE_CONTAINER=PASS architecture=$architecture revision=$revision digest=$digest cache=gha write=${CACHE_WRITE} publish=${PUBLISH_IMAGE}"
      - name: Purge stale artifacts before upload
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t ids < <(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=100" \
            --jq ".artifacts[] | select(.workflow_run.id != ${GITHUB_RUN_ID}) | select(.created_at < (now - 7200 | strftime(\"%Y-%m-%dT%H:%M:%SZ\"))) | .id" 2>/dev/null || true)
          for id in "${ids[@]}"; do
            gh api -X DELETE "repos/${GITHUB_REPOSITORY}/actions/artifacts/${id}" 2>/dev/null || true
          done
          echo "Purged ${#ids[@]} stale artifact(s)"
      - name: Upload immutable image digest
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: control-plane-image-digest-${{ github.sha }}
          path: image-digest/
          if-no-files-found: error
          retention-days: 7

      # GHCR packages inherit the org's default visibility (private) on first
      # publish. The production host pulls anonymously, so the package must
      # be public. Idempotent — PATCH with the same visibility is a no-op.
      - name: Ensure package visibility is public
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          owner_lower="$(printf '%s' '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          echo "Setting crowdrelay-control-plane to public…"
          gh api -X PATCH "/orgs/${owner_lower}/packages/container/crowdrelay-control-plane" \
            -f visibility=public 2>/dev/null \
            || gh api -X PATCH "/user/packages/container/crowdrelay-control-plane" \
            -f visibility=public 2>/dev/null \
            || echo "WARN: could not set crowdrelay-control-plane visibility"

  web:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --prefer-offline --no-audit --no-fund
      # The stylesheet grew by appending a fix layer each time something looked
      # wrong, until 343 declarations were being thrown away by the cascade.
      # This fails the build if dead declarations come back.
      - run: python3 scripts/dedupe-css.py src/styles.css --check --fail-on-dead
        shell: bash
      - run: npm run build
