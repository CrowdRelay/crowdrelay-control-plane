name: Deploy

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

permissions:
  contents: read
  packages: write

# Never cancel once the build starts. New pushes cancel CI (tests), but
# once this workflow begins building, it runs to completion — rolling
# containers mid-deploy would leave the tenant without a control plane.
# The next push queues behind this one, not over it.
concurrency:
  group: deploy-control-plane
  cancel-in-progress: false

env:
  IMAGE_SHA: ${{ github.event.workflow_run.head_sha }}
  REGISTRY: ghcr.io
  DEPLOY_DIR: /srv/crowdrelay-control-plane
  COMPOSE_FILE: compose.production.yml
  ENV_FILE: control-plane.env

jobs:
  build-and-deploy:
    name: Build, deploy, cleanup
    # Only after CI succeeds on main. CI runs tests; this workflow builds
    # the image, publishes it, deploys, and cleans up — all non-cancellable.
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == github.event.repository.default_branch

    runs-on: [self-hosted, arm64]
    timeout-minutes: 30

    steps:
      - name: Check out the exact validated revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.IMAGE_SHA }}

      - name: Resolve image identity
        shell: bash
        run: |
          set -euo pipefail
          owner_lower="$(printf '%s' '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          echo "OWNER_LOWER=${owner_lower}" >> "$GITHUB_ENV"
          echo "IMAGE_TAG=sha-${IMAGE_SHA}" >> "$GITHUB_ENV"
          echo "GHCR_IMAGE=${REGISTRY}/${owner_lower}/crowdrelay-control-plane:sha-${IMAGE_SHA}" >> "$GITHUB_ENV"
          echo "LOCAL_IMAGE=crowdrelay-control-plane:sha-${IMAGE_SHA}" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ── Build ──────────────────────────────────────────────────────────
      # Build the production image with cargo-chef dependency caching.
      # Registry cache (GHCR) avoids competing with the Actions cache pool.
      - name: Build and publish linux/arm64 production image
        shell: bash
        run: |
          set -euo pipefail
          owner_lower="$(printf '%s' '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          cache_ref="ghcr.io/${owner_lower}/crowdrelay-control-plane-buildcache:arm64"
          docker buildx build \
            --platform linux/arm64 \
            --build-arg "VCS_REF=${IMAGE_SHA}" \
            --cache-from "type=registry,ref=${cache_ref}" \
            --cache-to "type=registry,ref=${cache_ref},mode=max" \
            --tag "${GHCR_IMAGE}" \
            --push \
            .
          # Pull the published image locally for deploy + verification
          docker pull "${GHCR_IMAGE}" >/dev/null
          docker tag "${GHCR_IMAGE}" "${LOCAL_IMAGE}"
          architecture="$(docker image inspect "${LOCAL_IMAGE}" --format '{{.Architecture}}')"
          revision="$(docker image inspect "${LOCAL_IMAGE}" --format '{{index .Config.Labels "org.opencontainers.image.revision"}}')"
          [[ "$architecture" == "arm64" ]] || { echo "ERROR: wrong architecture: $architecture" >&2; exit 1; }
          [[ "$revision" == "$IMAGE_SHA" ]] || { echo "ERROR: revision mismatch: $revision != $IMAGE_SHA" >&2; exit 1; }
          # The digest the ecosystem deploy pins to.
          #
          # `4e782cd` split build and publish out of the cancellable CI
          # workflow -- correctly, because a cancelled build corrupts a shared
          # target directory -- but the immutable digest artifact went with it
          # and was never re-added here. `scripts/deploy.sh` still requires it,
          # so every ecosystem deploy has aborted at phase 2 since 2026-09-09
          # with "validated CI run is missing immutable image digest
          # artifact". This workflow kept working on its own, which is why it
          # went unnoticed.
          #
          # It belongs here rather than back in CI: this is the job that builds
          # and pushes, so it is the only one that can honestly attest what was
          # published.
          digest="$(docker image inspect "${LOCAL_IMAGE}" --format '{{index .RepoDigests 0}}' | cut -d@ -f2)"
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]] || {
            echo "ERROR: no usable digest for ${LOCAL_IMAGE}: $digest" >&2
            exit 1
          }
          mkdir -p image-digest
          printf 'CONTROL_PLANE_RELEASE_SHA=%s\nCONTROL_PLANE_IMAGE_DIGEST=%s\n' \
            "$IMAGE_SHA" "$digest" > image-digest/image.env
          ( cd image-digest && sha256sum image.env > image.env.sha256 )
          echo "BUILD=PASS arch=$architecture revision=$revision digest=$digest"

      # Uploaded from the build job so the ecosystem deploy can pin to the
      # exact image this run published, rather than to whatever `:main` points
      # at by the time it looks.
      - name: Upload immutable image digest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: control-plane-image-digest-${{ github.sha }}
          path: image-digest/
          retention-days: 30
          if-no-files-found: error

      # ── Deploy ─────────────────────────────────────────────────────────
      - name: Configure SSH to production host
        shell: bash
        env:
          SSH_KEY: ${{ secrets.CROWDRELAY_DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.CROWDRELAY_DEPLOY_KNOWN_HOSTS }}
          CROWDRELAY_DEPLOY_HOST_IP: ${{ secrets.CROWDRELAY_DEPLOY_HOST_IP }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts
          cat > ~/.ssh/config <<SSH
          Host virya-crowdrelay
              HostName ${CROWDRELAY_DEPLOY_HOST_IP}
              User ubuntu
              IdentityFile ~/.ssh/deploy_key
              IdentitiesOnly yes
              ServerAliveInterval 30
              ServerAliveCountMax 3
          SSH
          chmod 600 ~/.ssh/config
          echo "SSH=PASS"
      # Blue-green deploy via the canonical script. The script runs ON the
      # production host — it syncs the compose overlay and receipt helper to
      # /tmp/, starts the candidate, health-checks it, cuts over Caddy with a
      # graceful reload, soaks, and rolls back on failure. No Caddy restarts,
      # no force-recreate, no downtime.
      - name: Sync blue-green scripts to production host
        shell: bash
        run: |
          set -euo pipefail
          scp -q scripts/deploy-bluegreen.sh virya-crowdrelay:/tmp/cp-deploy-bluegreen.sh
          scp -q scripts/release_receipt.py virya-crowdrelay:/tmp/release_receipt.py
          scp -q deploy/compose.bluegreen.yml virya-crowdrelay:/tmp/cp-compose-bluegreen.yml
          echo "SYNC=PASS"

      - name: Blue-green deploy via SSH
        shell: bash
        run: |
          set -euo pipefail
          # Resolve the image digest for the blue-green script.
          IMAGE_DIGEST="$(docker image inspect "${LOCAL_IMAGE}" --format '{{index .RepoDigests 0}}' | sed 's/.*@//')"
          [[ "$IMAGE_DIGEST" =~ ^sha256: ]] || { echo "ERROR: no image digest for ${LOCAL_IMAGE}" >&2; exit 1; }
          echo "IMAGE_DIGEST=${IMAGE_DIGEST}"
          ssh virya-crowdrelay "sudo bash /tmp/cp-deploy-bluegreen.sh ${IMAGE_SHA} ${IMAGE_DIGEST} ${DEPLOY_DIR}"
          echo "BLUEGREEN=PASS sha=${IMAGE_SHA}"

      - name: Health check — wait for readiness
        shell: bash
        run: |
          set -euo pipefail
          echo "Waiting for control plane readiness..."
          for i in $(seq 1 30); do
            for container in crowdrelay-control-plane-app-green-1 crowdrelay-control-plane-app-1; do
              health="$(docker inspect "$container" --format '{{.State.Health.Status}}' 2>/dev/null || true)"
              if [[ "$health" == "healthy" ]]; then
                echo "HEALTH=PASS container=$container ready after ${i} attempt(s)"
                exit 0
              fi
            done
            sleep 3
          done
          echo "ERROR: control plane did not become ready in 90s" >&2
          exit 1

      - name: Verify deployed revision
        shell: bash
        run: |
          set -euo pipefail
          # The blue-green script may have switched to green; check whichever
          # container is running the new image.
          for container in crowdrelay-control-plane-app-1 crowdrelay-control-plane-app-green-1; do
            running_image="$(docker inspect "$container" --format '{{.Config.Image}}' 2>/dev/null || true)"
            if [[ "$running_image" == "${LOCAL_IMAGE}" ]]; then
              echo "REVISION=PASS container=$container running=${running_image}"
              exit 0
            fi
          done
          echo "ERROR: no container is running ${LOCAL_IMAGE}" >&2
          exit 1

      # ── Cleanup ────────────────────────────────────────────────────────
      - name: Cleanup — prune old images and build cache
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          set -uo pipefail
          docker builder prune --all -f 2>/dev/null || true
          docker image prune -f 2>/dev/null || true
          # Keep only the 2 newest control-plane images (latest + rollback)
          running_images="$(docker inspect $(docker ps -q) --format '{{.Image}}' 2>/dev/null | sort -u || echo "")"
          docker images --format '{{.Repository}}:{{.Tag}}\t{{.ID}}' 2>/dev/null \
            | grep -E '(^|/)crowdrelay-control-plane:sha-' \
            | sort -r \
            | tail -n +3 \
            | while IFS=$'\t' read -r repo_tag image_id; do
              echo "$running_images" | grep -q "$image_id" && continue
              docker rmi "$image_id" 2>/dev/null && echo "  pruned $repo_tag" || true
            done
          echo "CLEANUP=PASS"

      # GHCR packages inherit the org's default visibility (private) on first
      # publish. The production host pulls anonymously, so the package must
      # be public. Idempotent — PATCH with the same visibility is a no-op.
      - name: Ensure package visibility is public
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          owner_lower="$(printf '%s' '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          gh api -X PATCH "/orgs/${owner_lower}/packages/container/crowdrelay-control-plane" \
            -f visibility=public 2>/dev/null \
            || gh api -X PATCH "/user/packages/container/crowdrelay-control-plane" \
            -f visibility=public 2>/dev/null \
            || echo "WARN: could not set visibility"
