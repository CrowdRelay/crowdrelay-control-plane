name: Deploy

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

permissions:
  contents: read
  packages: read

# Never cancel a deploy in progress. New pushes cancel CI (tests + build),
# but once this workflow starts, it runs to completion — rolling containers
# mid-deploy would leave the tenant without a working control plane.
concurrency:
  group: deploy-control-plane
  cancel-in-progress: false

env:
  IMAGE_SHA: ${{ github.event.workflow_run.head_sha }}
  REGISTRY: ghcr.io
  DEPLOY_DIR: /srv/crowdrelay-control-plane
  COMPOSE_FILE: compose.production.yml
  ENV_FILE: control-plane.env

jobs:
  deploy:
    name: Deploy to production
    # Only deploy after CI succeeds on the default branch. CI builds and
    # publishes the image; this workflow pulls it and rolls the container.
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == github.event.repository.default_branch

    runs-on: [self-hosted, arm64]
    timeout-minutes: 10

    steps:
      - name: Resolve image identity
        shell: bash
        run: |
          set -euo pipefail
          owner_lower="$(printf '%s' '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          echo "OWNER_LOWER=${owner_lower}" >> "$GITHUB_ENV"
          echo "IMAGE_TAG=sha-${IMAGE_SHA}" >> "$GITHUB_ENV"
          echo "GHCR_IMAGE=${REGISTRY}/${owner_lower}/crowdrelay-control-plane:sha-${IMAGE_SHA}" >> "$GITHUB_ENV"
          echo "LOCAL_IMAGE=crowdrelay-control-plane:sha-${IMAGE_SHA}" >> "$GITHUB_ENV"

      - name: Pull validated image from GHCR
        shell: bash
        run: |
          set -euo pipefail
          echo "Pulling ${GHCR_IMAGE}..."
          docker pull "${GHCR_IMAGE}"
          # Retag to the local name the compose file expects
          docker tag "${GHCR_IMAGE}" "${LOCAL_IMAGE}"
          # Verify architecture and revision
          architecture="$(docker image inspect "${LOCAL_IMAGE}" --format '{{.Architecture}}')"
          revision="$(docker image inspect "${LOCAL_IMAGE}" --format '{{index .Config.Labels "org.opencontainers.image.revision"}}')"
          [[ "$architecture" == "arm64" ]] || { echo "ERROR: wrong architecture: $architecture" >&2; exit 1; }
          [[ "$revision" == "$IMAGE_SHA" ]] || { echo "ERROR: revision mismatch: $revision != $IMAGE_SHA" >&2; exit 1; }
          echo "IMAGE=PASS arch=$architecture revision=$revision"

      - name: Deploy — update env and restart container
        shell: bash
        run: |
          set -euo pipefail
          cd "${DEPLOY_DIR}"
          # Update the image tag in the env file
          sudo sed -i "s|^CONTROL_PLANE_IMAGE_TAG=.*|CONTROL_PLANE_IMAGE_TAG=${IMAGE_TAG}|" "${ENV_FILE}"
          # Verify the tag was written
          grep -q "CONTROL_PLANE_IMAGE_TAG=${IMAGE_TAG}" "${ENV_FILE}" || {
            echo "ERROR: failed to update CONTROL_PLANE_IMAGE_TAG in ${ENV_FILE}" >&2; exit 1; }
          echo "ENV=PASS tag=${IMAGE_TAG}"

          # Pull the current container's image tag for rollback reference
          PREV_TAG="$(docker inspect crowdrelay-control-plane-app-1 --format '{{.Config.Image}}' 2>/dev/null || echo "")"
          echo "PREV_IMAGE=${PREV_TAG}" >> "$GITHUB_ENV"

          # Recreate the app container with the new image. Compose handles
          # the dependency ordering (postgres healthy before app starts).
          sudo docker compose --env-file "${ENV_FILE}" -f "${COMPOSE_FILE}" up -d --no-deps app
          echo "COMPOSE_UP=PASS"

      - name: Health check — wait for readiness
        shell: bash
        run: |
          set -euo pipefail
          echo "Waiting for control plane readiness..."
          for i in $(seq 1 30); do
            if curl -fsS --connect-timeout 3 --max-time 5 http://127.0.0.1:8090/healthz/ready >/dev/null 2>&1; then
              echo "HEALTH=PASS ready after ${i} attempt(s)"
              exit 0
            fi
            sleep 3
          done
          echo "ERROR: control plane did not become ready in 90s" >&2
          # Rollback: restore previous image tag and restart
          echo "Rolling back to previous image..."
          cd "${DEPLOY_DIR}"
          if [[ -n "${PREV_IMAGE:-}" ]]; then
            sudo sed -i "s|^CONTROL_PLANE_IMAGE_TAG=.*|CONTROL_PLANE_IMAGE_TAG=${PREV_IMAGE}|" "${ENV_FILE}"
            sudo docker compose --env-file "${ENV_FILE}" -f "${COMPOSE_FILE}" up -d --no-deps app
          fi
          exit 1

      - name: Verify deployed revision
        shell: bash
        run: |
          set -euo pipefail
          # The running container's image should match the deployed SHA
          running_image="$(docker inspect crowdrelay-control-plane-app-1 --format '{{.Config.Image}}')"
          [[ "$running_image" == "${LOCAL_IMAGE}" ]] || {
            echo "ERROR: running image $running_image != expected ${LOCAL_IMAGE}" >&2; exit 1; }
          echo "REVISION=PASS running=${running_image}"

      - name: Cleanup — prune old images and build cache
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          set -uo pipefail
          # Prune all BuildKit cache (regrows on next build)
          docker builder prune --all -f 2>/dev/null || true
          # Prune dangling images
          docker image prune -f 2>/dev/null || true
          # Keep only the 2 newest control-plane images (latest + rollback)
          # Never delete images used by running containers
          running_images="$(docker inspect $(docker ps -q) --format '{{.Image}}' 2>/dev/null | sort -u || echo "")"
          docker images --format '{{.Repository}}:{{.Tag}}\t{{.ID}}' 2>/dev/null \
            | grep -E '(^|/)crowdrelay-control-plane:sha-' \
            | sort -r \
            | tail -n +3 \
            | while IFS=$'\t' read -r repo_tag image_id; do
              echo "$running_images" | grep -q "$image_id" && continue
              docker rmi "$image_id" 2>/dev/null && echo "  pruned $repo_tag" || true
            done
          echo "CLEANUP=PASS"
