name: Production smoke

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: control-plane-production-smoke
  cancel-in-progress: true

jobs:
  smoke:
    name: Edge + auth smoke
    runs-on: [self-hosted, arm64]
    timeout-minutes: 5
    env:
      CONTROL_PLANE_BASE_URL: ${{ vars.CONTROL_PLANE_PRODUCTION_BASE_URL || 'https://control.crowdrelay.music' }}
      CONTROL_PLANE_SMOKE_BASIC_AUTH: ${{ secrets.CONTROL_PLANE_SMOKE_BASIC_AUTH }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify live SPA, edge auth and authenticated overview
        run: bash scripts/production-smoke.sh
