[build]
  publish = "frontend/dist"

  # Production is built and deployed by GitHub Actions. Netlify must never
  # spend build minutes on Git-triggered source builds. Keep Build status
  # set to "Stopped builds" in Netlify; this ignore rule is defense in depth.
  ignore = "exit 0"

[build.environment]
  NODE_VERSION = "24"

# Edge proxy: route API and health calls to the Rust backend at
# control.virya.music. status=200 makes these proxies (not redirects),
# so the browser sees same-origin responses and HttpOnly cookies work.
[[redirects]]
  from = "/api/*"
  to = "https://control.virya.music/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/healthz/*"
  to = "https://control.virya.music/healthz/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/healthz"
  to = "https://control.virya.music/healthz"
  status = 200
  force = true

# SPA fallback — all client-side routes serve index.html.
# Must come AFTER the API/health proxy redirects above.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Long-lived, content-addressed static assets.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
